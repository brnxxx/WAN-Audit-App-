<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WAN Audit — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-page: #F5F6F8;
    --panel-dark: #12181F;
    --panel-line: #2A343F;
    --accent: #3D5AFE;
    --accent-soft: #E8ECFF;
    --text-primary: #14181C;
    --text-muted: #6B7280;
    --text-inverse: #E7EAEE;
    --text-inverse-muted: #7C8794;
    --border: #DEE1E6;
    --status-ok: #2FAE66;
    --status-warn: #D98E04;
    --status-unknown: #6B7480;
    --status-bad: #D64545;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text-primary);
    background: var(--bg-page);
  }

  .layout {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  }

  /* ---------- Left panel: network context ---------- */
  .panel-network {
    background: var(--panel-dark);
    color: var(--text-inverse);
    padding: 48px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .topology {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 0;
  }

  .topology svg { width: 100%; max-width: 380px; height: auto; }

  .node-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    fill: var(--text-inverse);
  }

  .node-sublabel {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    fill: var(--text-inverse-muted);
  }

  .link-line { stroke: var(--panel-line); stroke-width: 1.5; }

  .panel-footer {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-inverse-muted);
    line-height: 1.6;
  }

  .panel-footer strong { color: var(--text-inverse); font-weight: 500; }

  /* ---------- Right panel: login form ---------- */
  .panel-form {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .form-wrap {
    width: 100%;
    max-width: 360px;
  }

  .form-wrap h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .form-wrap p.lead {
    margin: 0 0 36px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .field { margin-bottom: 18px; }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .toggle-visibility {
    background: none;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
  }

  .submit-btn {
    width: 100%;
    padding: 11px 16px;
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .submit-btn:hover { background: #2E46E0; }
  .submit-btn:disabled { background: #A9B3E8; cursor: not-allowed; }

  .message {
    margin-top: 14px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius);
    display: none;
  }

  .message.error {
    display: block;
    background: #FBEAEA;
    color: #A32424;
    border: 1px solid #F1C7C7;
  }

  .message.success {
    display: block;
    background: #E9F7EF;
    color: #1E7A45;
    border: 1px solid #C3E9D2;
  }

  .api-status {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .api-status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--status-unknown);
    flex-shrink: 0;
  }

  .api-status .dot.ok { background: var(--status-ok); }
  .api-status .dot.bad { background: var(--status-bad); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .panel-network { display: none; }
    .panel-form { padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="panel-network">
    <div class="brand">
      <span class="brand-dot"></span>
      WAN Audit
    </div>

    <div class="topology">
      <svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
        <!-- links -->
        <line class="link-line" x1="160" y1="30" x2="160" y2="90" />
        <line class="link-line" x1="160" y1="90" x2="60" y2="170" />
        <line class="link-line" x1="160" y1="90" x2="160" y2="170" />
        <line class="link-line" x1="160" y1="90" x2="260" y2="170" />

        <!-- Internet node -->
        <circle cx="160" cy="20" r="5" fill="none" stroke="#4A5560" stroke-width="1.5" />
        <text x="172" y="18" class="node-label">Internet</text>

        <!-- Backbone node -->
        <circle cx="160" cy="90" r="6" fill="none" stroke="var(--accent)" stroke-width="1.8" />
        <text x="174" y="94" class="node-label">Backbone</text>

        <!-- Site nodes -->
        <circle cx="60" cy="180" r="5" fill="#2FAE66" />
        <text x="30" y="205" class="node-label" text-anchor="middle">Site 1</text>
        <text x="30" y="219" class="node-sublabel" text-anchor="middle">online</text>

        <circle cx="160" cy="180" r="5" fill="#2FAE66" />
        <text x="160" y="205" class="node-label" text-anchor="middle">Site 2</text>
        <text x="160" y="219" class="node-sublabel" text-anchor="middle">online</text>

        <circle cx="260" cy="180" r="5" fill="#D98E04" />
        <text x="260" y="205" class="node-label" text-anchor="middle">Site 3</text>
        <text x="260" y="219" class="node-sublabel" text-anchor="middle">warning</text>
      </svg>
    </div>

    <div class="panel-footer">
      Surveillance de l'infrastructure multi-sites<br />
      <strong>Site 1 · Site 2 · Site 3 · Backbone</strong>
    </div>
  </div>

  <div class="panel-form">
    <div class="form-wrap">
      <h1>Connexion</h1>
      <p class="lead">Accès réservé à l'administration du monitoring réseau.</p>

      <form id="login-form">
        <div class="field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>

        <div class="field">
          <div class="field-row">
            <label for="password" style="margin-bottom:0;">Mot de passe</label>
            <button type="button" class="toggle-visibility" id="toggle-password">Afficher</button>
          </div>
          <input type="password" id="password" name="password" autocomplete="current-password" required style="margin-top:6px;" />
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>

        <div class="message" id="message"></div>
      </form>

      <div class="api-status">
        <span class="dot" id="api-dot"></span>
        <span id="api-text">Vérification de l'API...</span>
      </div>
    </div>
  </div>

</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  const form = document.getElementById("login-form");
  const submitBtn = document.getElementById("submit-btn");
  const messageBox = document.getElementById("message");
  const togglePasswordBtn = document.getElementById("toggle-password");
  const passwordInput = document.getElementById("password");
  const apiDot = document.getElementById("api-dot");
  const apiText = document.getElementById("api-text");

  togglePasswordBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePasswordBtn.textContent = isPassword ? "Masquer" : "Afficher";
  });

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
  }

  async function checkApiStatus() {
    try {
      const res = await fetch(`${API_BASE}/`, { method: "GET" });
      if (res.ok) {
        apiDot.classList.add("ok");
        apiText.textContent = "API connectée";
      } else {
        throw new Error("bad status");
      }
    } catch (err) {
      apiDot.classList.add("bad");
      apiText.textContent = "API injoignable (vérifie qu'uvicorn tourne)";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageBox.className = "message";
    submitBtn.disabled = true;
    submitBtn.textContent = "Connexion...";

    const username = document.getElementById("username").value.trim();
    const password = passwordInput.value;

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showMessage(data.detail || "Identifiants incorrects.", "error");
      } else {
        showMessage(`Connecté en tant que ${data.username}.`, "success");
        // TODO: rediriger vers le dashboard une fois qu'il existe
      }
    } catch (err) {
      showMessage("Impossible de contacter l'API.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Se connecter";
    }
  });

  checkApiStatus();
</script>

</body>
</html>
